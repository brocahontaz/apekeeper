name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Quality gate only; nothing to complete, so superseded runs are always cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: apekeeper
          POSTGRES_PASSWORD: apekeeper
          POSTGRES_DB: apekeeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apekeeper -d apekeeper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Check formatting
        run: cd backend && test -z "$(gofmt -l .)"
        shell: bash

      - name: Vet
        run: cd backend && go vet ./...

      - name: Test
        env:
          DATABASE_URL: postgres://apekeeper:apekeeper@localhost:5432/apekeeper?sslmode=disable
        run: cd backend && go test ./... -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Check
        run: cd frontend && npm run check

      - name: Test
        run: cd frontend && npm run test

      - name: Build
        run: cd frontend && npm run build
